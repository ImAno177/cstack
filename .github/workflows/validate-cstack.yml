name: validate cstack plugin

on:
  push:
    branches: [main]
    paths:
      - ".cstack/**"
      - "skills/**"
      - "agents/**"
      - ".agents/**"
      - ".github/workflows/**"
      - ".codex-plugin/**"
      - ".grok-plugin/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/**"
      - "tests/**"
      - "plugin.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - "LICENSE"
      - "licenses/**"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
  pull_request:
    paths:
      - ".cstack/**"
      - "skills/**"
      - "agents/**"
      - ".agents/**"
      - ".github/workflows/**"
      - ".codex-plugin/**"
      - ".grok-plugin/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/**"
      - "tests/**"
      - "plugin.json"
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - "LICENSE"
      - "licenses/**"
      - "CHANGELOG.md"
      - "THIRD_PARTY_NOTICES.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/validate_plugin.py --root .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile benchmarks/reproduction/run_codex_ab.py benchmarks/reproduction/micrograd/grade.py
      - run: python benchmarks/reproduction/run_codex_ab.py --help
      - name: Verify locked upstream snapshot when present
        run: |
          if [ -f .cstack/upstreams.lock.json ]; then
            python scripts/sync_upstream_skills.py --check
          fi
      - run: >-
          python scripts/validate_skill_stack.py
          --source-root .
          --plugin-root .
          --policy .cstack/skill-policy.json
      - run: python scripts/generate_grok_plugin_index.py --check
