name: sync upstream skills

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/sync_upstream_skills.py --write
      - run: python scripts/validate_plugin.py --root .
      - run: >-
          python scripts/validate_skill_stack.py
          --source-root .
          --plugin-root .
          --policy .cstack/skill-policy.json
      - run: python scripts/generate_grok_plugin_index.py
      - run: python scripts/generate_grok_plugin_index.py --check
      - name: commit upstream updates
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills .grok-plugin/plugin-index.json
          git commit -m "chore: sync upstream skills [skip ci]"
          git push
