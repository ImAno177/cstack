name: sync upstream skills

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python scripts/sync_upstream_skills.py --write
      - run: python scripts/sync_upstream_skills.py --check
      - run: python scripts/validate_plugin.py --root .
      - run: >-
          python scripts/validate_skill_stack.py
          --source-root .
          --plugin-root .
          --policy .cstack/skill-policy.json
      - run: python scripts/generate_grok_plugin_index.py
      - run: python scripts/generate_grok_plugin_index.py --check
      - name: Open review PR (never push to main)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- skills .cstack/upstreams.lock.json .grok-plugin/plugin-index.json)" ]; then
            echo "No upstream changes"
            exit 0
          fi
          if gh pr list --state open --json headRefName --jq '.[].headRefName' | grep -q '^automation/upstream-sync-'; then
            echo "::warning::An upstream sync PR is already open. Review/merge it first."
            exit 0
          fi
          branch="automation/upstream-sync-${RUN_ID}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills .cstack/upstreams.lock.json .grok-plugin/plugin-index.json
          git commit -m "chore: propose upstream skills update"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: review upstream skill updates" \
            --body "Automated upstream refresh. Review vendored skill changes and .cstack/upstreams.lock.json (source commit SHAs and content hashes) before merging. Validation runs on the PR."
