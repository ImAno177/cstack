name: sync upstream skills

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-upstream]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: fetch pstack
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/cursor/plugins.git "$RUNNER_TEMP/pstack"
          git -C "$RUNNER_TEMP/pstack" sparse-checkout set pstack/skills
      - name: fetch ponytail
        run: git clone --depth 1 https://github.com/DietrichGebert/ponytail.git "$RUNNER_TEMP/ponytail"
      - name: import upstream skills
        run: >-
          python scripts/sync_upstream.py
          --source source/upstream
          --manifest .cstack/upstream.json
          --upstream pstack "$RUNNER_TEMP/pstack/pstack/skills"
          --upstream ponytail "$RUNNER_TEMP/ponytail/skills"
      - name: build plugin
        run: >-
          python scripts/build_plugin.py
          --source-root source
          --destination plugins/cstack/skills
      - name: validate plugin
        run: python scripts/validate_plugin.py --root plugins/cstack
      - name: commit upstream changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/upstream plugins/cstack/skills .cstack/upstream.json
          git commit -m "sync upstream skills [skip ci]"
          git push
