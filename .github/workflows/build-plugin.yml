name: build cstack plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [build-plugin]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: build plugin
        run: >-
          python scripts/build_plugin.py
          --source-root source
          --destination plugins/cstack/skills
      - name: validate plugin
        run: python scripts/validate_plugin.py --root plugins/cstack
      - name: bump plugin version on source changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          changed=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          if echo "$changed" | grep -Eq '^(source/|plugins/cstack/skills/)'; then
            python scripts/bump_version.py \
              --manifest plugins/cstack/plugin.json \
              --manifest plugins/cstack/.grok-plugin/plugin.json
          fi
      - name: commit generated plugin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/cstack/plugin.json plugins/cstack/.grok-plugin/plugin.json plugins/cstack/skills
          git commit -m "build cstack plugin [skip ci]"
          git push
      - name: package plugin
        run: |
          mkdir -p dist
          cd plugins/cstack
          zip -qr "../../dist/cstack-${GITHUB_SHA}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: cstack-plugin-${{ github.sha }}
          path: dist/*.zip
      - name: publish build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: cstack build ${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.zip
